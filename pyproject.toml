[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kartini-agent-kit"
version = "0.1.0"
description = "Kar-Tini workflows for Codex and the terminal"
requires-python = ">=3.9"

[project.scripts]
kartini = "kartini_agent_kit.cli:main"

[tool.setuptools.packages.find]
include = ["kartini_agent_kit*"]
